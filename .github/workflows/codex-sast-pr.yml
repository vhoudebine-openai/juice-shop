name: Codex Security PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codex-security-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex-security:
    name: Codex Security
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codex-sast.yml
    secrets: inherit
